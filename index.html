<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PokéBomba</title>
<meta name="theme-color" content="#0b0d1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d1c;--bg2:#141736;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);
  --txt:#f4f5ff;--mut:#a3a8d1;--red:#ff3b4e;--red2:#c3102a;--org:#ff9f1c;--yel:#ffd23f;--grn:#2ee59d;--blu:#4d7cff;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:Outfit,system-ui,sans-serif;overflow-x:hidden;
  background-image:radial-gradient(1200px 700px at 15% -10%,#2a1b5c 0%,transparent 60%),radial-gradient(900px 600px at 110% 110%,#4a0f2a 0%,transparent 55%);
  background-attachment:fixed}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
input,select{font-family:inherit;font-size:16px}
.hidden{display:none!important}
.logo{font-family:Bungee,sans-serif;letter-spacing:1px;line-height:1;background:linear-gradient(180deg,#fff 0%,#ffd23f 55%,#ff9f1c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #b3161f) drop-shadow(0 10px 18px rgba(0,0,0,.5))}
.btn{padding:14px 20px;border-radius:14px;font-weight:800;font-size:17px;background:var(--card);border:1px solid var(--line);transition:transform .08s,filter .15s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:linear-gradient(180deg,#ffd23f,#ff9f1c);color:#2a1300;border:0;box-shadow:0 5px 0 #b35f00}
.btn.red{background:linear-gradient(180deg,#ff5a6a,#d9142f);border:0;box-shadow:0 5px 0 #7d0718}
.btn.grn{background:linear-gradient(180deg,#48f0b0,#18b97a);color:#012b1a;border:0;box-shadow:0 5px 0 #0a6b45}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(8px)}
.mut{color:var(--mut)}
.center{display:flex;align-items:center;justify-content:center}

/* ---------- HOME / JOIN ---------- */
.screen{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;gap:22px}
.home-logo{font-size:clamp(46px,12vw,96px);text-align:center}
.tag{color:var(--mut);text-align:center;max-width:460px;font-size:17px}
.panel{width:100%;max-width:420px;padding:22px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.field input{padding:14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--txt);outline:none}
.field input:focus{border-color:var(--yel)}
.code-in{text-transform:uppercase;font-family:Bungee;font-size:26px!important;letter-spacing:.3em;text-align:center}
.av-pick{display:flex;align-items:center;gap:14px}
.av-pick img{width:96px;height:96px;background:radial-gradient(circle,#2a2f66,#15183a);border-radius:50%;border:3px solid var(--yel);object-fit:contain;padding:6px}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- STAGE (host / spectator) ---------- */
#stage{position:fixed;inset:0;display:grid;grid-template-columns:1fr auto;overflow:hidden}
#stage.clean{grid-template-columns:1fr}
#stage.clean #ctrl{display:none}
#arenaWrap{position:relative;display:flex;flex-direction:column;align-items:center;padding:14px;gap:10px;min-width:0;min-height:0}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px}
.round-badge{font-family:Bungee;font-size:clamp(14px,2.2vw,22px);padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.stage-logo{font-size:clamp(22px,3.4vw,38px)}
.room-chip{font-family:Bungee;font-size:clamp(12px,1.8vw,18px);color:var(--mut)}
.room-chip b{color:var(--yel)}

.catbox{width:min(100%,900px);text-align:center;padding:14px 18px;position:relative}
.cat-kicker{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);font-weight:800}
.cat-title{font-family:Bungee;font-size:clamp(20px,3.6vw,44px);line-height:1.1;margin:6px 0 8px}
.cat-title .hl{color:var(--yel)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{padding:5px 12px;border-radius:999px;font-weight:800;font-size:14px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.25)}
.cat-count{margin-top:6px;font-size:13px;color:var(--mut)}
.catbox.spin .cat-title{animation:flick .09s steps(1) infinite;opacity:.8}
.catbox.land{animation:land .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes land{0%{transform:scale(.7)}100%{transform:scale(1)}}
@keyframes flick{50%{transform:translateY(-2px)}}

.arena{position:relative;flex:1;width:100%;min-height:0;display:flex;align-items:center;justify-content:center}
.ring{position:relative;aspect-ratio:1;height:100%;max-width:100%;max-height:100%}
.ring:before{content:"";position:absolute;inset:12%;border-radius:50%;border:2px dashed rgba(255,255,255,.1);background:radial-gradient(circle,rgba(255,59,78,.08),transparent 70%)}
.pl{position:absolute;width:24%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;transition:filter .4s,opacity .4s}
.pl .ava{width:100%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 35%,#343a86,#15183a 70%);border:4px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.pl .ava img{width:84%;height:84%;object-fit:contain;filter:drop-shadow(0 4px 4px rgba(0,0,0,.4))}
.pl .nm{font-weight:800;font-size:clamp(12px,1.7vh,20px);background:rgba(0,0,0,.45);padding:3px 10px;border-radius:999px;max-width:140%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl.hold .ava{border-color:var(--red);box-shadow:0 0 0 6px rgba(255,59,78,.25),0 0 40px rgba(255,59,78,.7);animation:shake .35s infinite}
.pl.next .ava{border-color:rgba(255,210,63,.6)}
.pl.dead{filter:grayscale(1) brightness(.5)}
.pl.dead .ava:after{content:"✖";position:absolute;font-size:300%;color:var(--red);font-weight:900;text-shadow:0 2px 8px #000}
.pl.off{opacity:.45}
.pl .off-tag{font-size:11px;color:var(--mut)}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}

.bomb{position:absolute;width:21%;aspect-ratio:1;transform:translate(-50%,-50%);transition:left .28s cubic-bezier(.3,1.4,.5,1),top .28s cubic-bezier(.3,1.4,.5,1);z-index:5;pointer-events:none}
.bomb svg{width:100%;height:100%;overflow:visible}
.bomb .num{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);font-family:Bungee;font-size:clamp(18px,5vh,54px);color:#fff;text-shadow:0 3px 0 #000}
.bomb.hot svg .body{animation:throb .5s infinite}
.bomb.hot .num{color:var(--yel);animation:throb .5s infinite}
@keyframes throb{50%{transform:scale(1.08)}}
.bomb svg .body{transform-origin:50% 60%;transform-box:fill-box}
.spark{animation:sparkle .12s infinite alternate}
@keyframes sparkle{from{transform:scale(.8) rotate(0)}to{transform:scale(1.25) rotate(40deg)}}

.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;z-index:20;text-align:center;padding:20px}
.overlay.dim{background:rgba(5,6,18,.72);backdrop-filter:blur(4px)}
.big{font-family:Bungee;font-size:clamp(48px,12vw,160px);line-height:1}
.cd{animation:pop .9s ease-out}
@keyframes pop{0%{transform:scale(2.2);opacity:0}30%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:.2}}
.stop-title{color:var(--red);filter:drop-shadow(0 6px 0 #5c0010)}
.boom-title{background:linear-gradient(180deg,#fff,#ffd23f 40%,#ff3b4e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 #5c0010)}
.sub{font-size:clamp(18px,2.6vw,30px);font-weight:800}
.flash{position:fixed;inset:0;background:#fff;z-index:50;pointer-events:none;animation:flash .6s forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}
.shakeit{animation:bigshake .6s}
@keyframes bigshake{0%,100%{transform:none}10%{transform:translate(-14px,8px)}20%{transform:translate(12px,-10px)}30%{transform:translate(-10px,-6px)}40%{transform:translate(8px,10px)}50%{transform:translate(-6px,4px)}70%{transform:translate(4px,-3px)}}
.boomfx{position:absolute;width:0;height:0;z-index:30;pointer-events:none}
.boomfx .ring2{position:absolute;left:-10px;top:-10px;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle,#fff 0,#ffd23f 25%,#ff9f1c 45%,#ff3b4e 65%,transparent 72%);animation:bloom .7s ease-out forwards}
@keyframes bloom{to{transform:scale(28);opacity:0}}
.boomfx i{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--org);animation:shard .9s ease-out forwards}
@keyframes shard{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.winner-av{width:clamp(140px,26vh,260px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#ffd23f55,#15183a 70%);border:6px solid var(--yel);display:flex;align-items:center;justify-content:center;animation:float 2s ease-in-out infinite;box-shadow:0 0 80px #ffd23f66}
.winner-av img{width:86%}
@keyframes float{50%{transform:translateY(-12px)}}
.confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:40;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* controls sidebar */
#ctrl{width:340px;border-left:1px solid var(--line);background:rgba(10,12,30,.75);backdrop-filter:blur(10px);display:flex;flex-direction:column;overflow:auto;padding:16px;gap:14px}
#ctrl h3{font-family:Bungee;font-size:15px;letter-spacing:.05em;color:var(--yel)}
.box{padding:14px;display:flex;flex-direction:column;gap:10px}
.linkrow{display:flex;gap:6px}
.linkrow input{flex:1;min-width:0;padding:8px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--mut);font-size:12px}
#qr{background:#fff;border-radius:12px;padding:8px;align-self:center}
#qr img,#qr svg{display:block}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;background:rgba(255,255,255,.04)}
.prow img{width:34px;height:34px;object-fit:contain}
.prow .n{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--grn);flex:none}.dot.off{background:#555}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:8px 0;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:800}
.seg button.on{background:var(--yel);color:#2a1300;border-color:var(--yel)}
.net{font-size:12px;color:var(--mut);display:flex;gap:10px;flex-wrap:wrap}
.net span:before{content:"●";margin-right:4px;color:#555}.net span.ok:before{color:var(--grn)}.net span.bad:before{color:var(--red)}
.answers{max-height:260px;overflow:auto;font-size:13px;columns:2;column-gap:10px;color:var(--mut)}
.answers div{break-inside:avoid;padding:1px 0}
.stopbox{border:2px solid var(--red);background:rgba(255,59,78,.1)}
.toggle-clean{position:absolute;right:10px;bottom:10px;z-index:60;opacity:.25}
.toggle-clean:hover{opacity:1}

/* ---------- PLAYER ---------- */
#player{min-height:100%;display:flex;flex-direction:column;padding:12px 14px 16px;gap:12px;max-width:560px;margin:0 auto;transition:background .3s}
body.danger{animation:dangerbg .6s infinite}
@keyframes dangerbg{50%{background-color:#3a0612}}
.p-top{display:flex;align-items:center;gap:10px}
.p-top img{width:44px;height:44px;object-fit:contain;background:rgba(255,255,255,.06);border-radius:50%}
.p-top .who{flex:1;min-width:0}
.p-top .who b{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-top .who small{color:var(--mut)}
.stopbtn{padding:12px 18px;border-radius:14px;font-family:Bungee;font-size:18px;background:transparent;border:3px solid var(--red);color:var(--red)}
.stopbtn:active{background:var(--red);color:#fff}
.stopbtn:disabled{opacity:.3}
.p-cat{padding:14px;text-align:center}
.p-cat .cat-title{font-size:clamp(20px,6.4vw,30px)}
.p-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;min-height:260px}
.p-bomb{width:min(58vw,260px);position:relative}
.p-bomb .num{font-size:clamp(34px,11vw,64px)}
.passbtn{width:100%;padding:26px 10px;border-radius:24px;font-family:Bungee;font-size:clamp(30px,10vw,52px);background:linear-gradient(180deg,#ff5a6a,#d9142f);box-shadow:0 10px 0 #7d0718,0 20px 40px rgba(255,59,78,.4);color:#fff;letter-spacing:.03em}
.passbtn:active{transform:translateY(6px);box-shadow:0 4px 0 #7d0718}
.passbtn:disabled{background:#2a2d4a;box-shadow:0 10px 0 #16182c;color:#555a88}
.holder-mini{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:800}
.holder-mini img{width:84px;height:84px;object-fit:contain;animation:shake .35s infinite}
.bar{width:100%;height:12px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--org),var(--yel));border-radius:99px}
.strip{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.strip div{display:flex;flex-direction:column;align-items:center;width:62px;font-size:11px;font-weight:600;gap:2px;opacity:1}
.strip img{width:46px;height:46px;object-fit:contain;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid transparent}
.strip .h img{border-color:var(--red);box-shadow:0 0 14px var(--red)}
.strip .d{filter:grayscale(1);opacity:.4}
.strip .me span{color:var(--yel)}
.strip span{max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmsg{font-size:18px;font-weight:800}
.connbar{position:fixed;top:0;left:0;right:0;padding:6px;text-align:center;font-size:13px;background:#6b0e1d;z-index:99}

@media (max-width:860px){
  #stage{grid-template-columns:1fr;grid-template-rows:1fr auto;position:static;min-height:100%}
  #ctrl{width:auto;border-left:0;border-top:1px solid var(--line);max-height:none}
  #arenaWrap{min-height:92vh}
}
</style>
</head>

<script>
"use strict";
/* =========================================================
   POKÉBOMBA — pasar la bomba con categorías Pokémon
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s);
const Q=new URLSearchParams(location.search);
const ROOM=(Q.get('sala')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
const ROLE=ROOM?(Q.get('rol')||'player'):'home';
const LOCAL=Q.has('local');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const SPR=id=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;

/* ---------------- Datos / categorías ---------------- */
const TYPES=['Normal','Lucha','Volador','Veneno','Tierra','Roca','Bicho','Fantasma','Acero','Fuego','Agua','Planta','Eléctrico','Psíquico','Hielo','Dragón','Siniestro','Hada'];
const TCOL=['#9fa19f','#e0712c','#81b9ef','#9141cb','#915121','#afa981','#91a119','#704170','#60a1b8','#e62829','#2980ef','#3fa129','#fac000','#ef4179','#3dcef3','#5060e1','#624d4e','#ef70ef'];
const REG=['','Kanto','Johto','Hoenn','Sinnoh','Teselia','Kalos','Alola','Galar','Paldea'];
const RCOL=['','#e84b3c','#c9a227','#2e9e5b','#6c63d9','#3b3b3b','#1f7fbf','#f08a24','#8e3b9e','#c2185b'];
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
const LETTER=POKE.map(p=>norm(p[1]).replace(/[^A-Z]/g,'')[0]||'?');
const mult=(atk,ts)=>ts.reduce((m,t)=>m*EFF[atk][t],1);
const PRED={
  type:v=>p=>p[3].includes(v),
  gen:v=>p=>p[2]===v,
  letter:v=>p=>LETTER[p[0]-1]===v,
  weak:v=>p=>mult(v,p[3])>1,
  line3:()=>p=>p[4]===1,
};
const ORDER=['weak','type','gen','line3','letter'];
const TEMPLATES=[
  [['type'],3],[['letter'],3],[['gen'],2],[['weak'],2],
  [['type','gen'],5],[['weak','gen'],5],[['letter','gen'],2],[['letter','type'],2],
  [['line3','gen'],2],[['line3','type'],3],[['line3','letter'],1],[['weak','line3'],2],[['line3'],1],
];
const MIN_ANSWERS=20;
function randVal(k){
  if(k==='type'||k==='weak')return rnd(18);
  if(k==='gen')return 1+rnd(9);
  if(k==='letter')return pick(LETTER);          // ponderado por cantidad
  return 1;
}
function catMatches(parts){const fs=parts.map(([k,v])=>PRED[k](v));return POKE.filter(p=>fs.every(f=>f(p)))}
const catKey=parts=>parts.map(p=>p.join(':')).sort().join('|');
function genCategory(used=[]){
  const tot=TEMPLATES.reduce((a,t)=>a+t[1],0);
  for(let tries=0;tries<500;tries++){
    let r=Math.random()*tot,tpl=TEMPLATES[0][0];
    for(const [t,w] of TEMPLATES){if((r-=w)<0){tpl=t;break}}
    for(let j=0;j<60;j++){
      const parts=tpl.map(k=>[k,randVal(k)]);
      const key=catKey(parts);
      if(used.includes(key))continue;
      const n=catMatches(parts).length;
      if(n>=MIN_ANSWERS)return {parts,n,key};
    }
  }
  return {parts:[['type',10]],n:catMatches([['type',10]]).length,key:'type:10'};
}
function catHTML(c){
  if(!c)return {title:'',chips:''};
  const ps=[...c.parts].sort((a,b)=>ORDER.indexOf(a[0])-ORDER.indexOf(b[0]));
  const seg=[],chips=[];
  for(const [k,v] of ps){
    if(k==='type'){seg.push(`de tipo <span class="hl" style="color:${TCOL[v]}">${TYPES[v]}</span>`);chips.push(`<span class="chip" style="background:${TCOL[v]}">Tipo ${TYPES[v]}</span>`)}
    if(k==='weak'){seg.push(`débiles a <span class="hl" style="color:${TCOL[v]}">${TYPES[v]}</span>`);chips.push(`<span class="chip" style="background:${TCOL[v]}">Débil a ${TYPES[v]}</span>`)}
    if(k==='gen'){seg.push(`de <span class="hl">${REG[v]}</span>`);chips.push(`<span class="chip" style="background:${RCOL[v]}">${REG[v]} · Gen ${v}</span>`)}
    if(k==='line3'){seg.push(`con <span class="hl">línea evolutiva de 3</span>`);chips.push(`<span class="chip" style="background:#6b4bd8">Línea de 3 etapas</span>`)}
    if(k==='letter'){seg.push(`que empiezan con <span class="hl">«${v}»</span>`);chips.push(`<span class="chip" style="background:#2b2f5a">Letra ${v}</span>`)}
  }
  return {title:'Pokémon '+seg.join(' '),chips:chips.join('')};
}

/* ---------------- Sonido ---------------- */
let AC=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function beep(f=880,d=.07,type='square',vol=.08){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d)}
function boomSound(){const a=audio();if(!a)return;const len=a.sampleRate*1.4,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(1800,a.currentTime);f.frequency.exponentialRampToValueAtTime(80,a.currentTime+1.2);const g=a.createGain();g.gain.value=.9;s.connect(f).connect(g).connect(a.destination);s.start();beep(60,.6,'sine',.5)}
function passSound(){beep(520,.05,'triangle',.12);setTimeout(()=>beep(880,.07,'triangle',.12),50)}
function stopSound(){beep(300,.15,'sawtooth',.1);setTimeout(()=>beep(200,.25,'sawtooth',.1),150)}
function winSound(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.18,'triangle',.12),i*140))}

const PEER_PREFIX='pkbomba-v1-';
const BROKER='wss://broker.emqx.io:8084/mqtt';
const TOPIC=r=>'pkbomba/v1/'+r;
const LIBS={peer:'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',mqtt:'https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js',qr:'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js'};
const loaded={};
function loadScript(k){return loaded[k]||(loaded[k]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=LIBS[k];s.onload=res;s.onerror=()=>{delete loaded[k];rej(new Error('No cargó '+k))};document.head.appendChild(s)}))}

class HostNet{
  constructor(room,onMsg,onStatus){this.room=room;this.onMsg=onMsg;this.onStatus=onStatus;this.conns=new Set();this.mqttSeen=0;this.st={p2p:'…',mqtt:'…'};
    try{this.bc=new BroadcastChannel('pkbomba-'+room);this.bc.onmessage=e=>{if(e.data&&e.data.up)this.onMsg(e.data.m)}}catch(e){}}
  status(k,v){this.st[k]=v;this.onStatus&&this.onStatus(this.st)}
  async start(){if(LOCAL){this.status('p2p','local');this.status('mqtt','local');return}this.startPeer();this.startMqtt()}
  async startPeer(){
    try{await loadScript('peer')}catch(e){this.status('p2p','bad');setTimeout(()=>this.startPeer(),4000);return}
    const peer=new Peer(PEER_PREFIX+this.room,{debug:0});this.peer=peer;
    peer.on('open',()=>this.status('p2p','ok'));
    peer.on('connection',c=>{c.on('open',()=>this.conns.add(c));c.on('data',m=>this.onMsg(m));c.on('close',()=>this.conns.delete(c));c.on('error',()=>this.conns.delete(c))});
    peer.on('disconnected',()=>{this.status('p2p','bad');setTimeout(()=>{try{peer.reconnect()}catch(e){}},1500)});
    peer.on('error',e=>{this.status('p2p','bad');if(['unavailable-id','network','server-error','socket-error','socket-closed'].includes(e.type)){try{peer.destroy()}catch(_){}setTimeout(()=>this.startPeer(),3000)}});
  }
  async startMqtt(){
    try{await loadScript('mqtt')}catch(e){this.status('mqtt','bad');setTimeout(()=>this.startMqtt(),4000);return}
    const c=mqtt.connect(BROKER,{clientId:'pkbh_'+Math.random().toString(36).slice(2,10),reconnectPeriod:2000,connectTimeout:8000,clean:true});this.mq=c;
    c.on('connect',()=>{this.status('mqtt','ok');c.subscribe(TOPIC(this.room)+'/up')});
    c.on('close',()=>this.status('mqtt','bad'));
    c.on('message',(t,p)=>{try{this.mqttSeen=Date.now();this.onMsg(JSON.parse(p.toString()))}catch(e){}});
  }
  send(m){
    for(const c of this.conns){try{c.open&&c.send(m)}catch(e){}}
    if(this.mq&&this.mq.connected&&Date.now()-this.mqttSeen<20000)this.mq.publish(TOPIC(this.room)+'/down',JSON.stringify(m));
    if(this.bc)this.bc.postMessage({down:1,m});
  }
}

class ClientNet{
  constructor(room,onMsg,onStatus){this.room=room;this.onMsg=onMsg;this.onStatus=onStatus;this.mode='';this.lastRx=0}
  rx(m){this.lastRx=Date.now();this.onMsg(m)}
  status(s){this.mode=s;this.onStatus&&this.onStatus(s)}
  start(){
    if(LOCAL){this.bc=new BroadcastChannel('pkbomba-'+this.room);this.bc.onmessage=e=>{if(e.data&&e.data.down)this.rx(e.data.m)};this.status('local');return}
    this.tryPeer();
  }
  async tryPeer(){
    this.status('conectando');
    let done=false;const fail=()=>{if(done)return;done=true;this.startMqtt()};
    const to=setTimeout(fail,7000);
    try{await loadScript('peer')}catch(e){clearTimeout(to);fail();return}
    try{
      const peer=new Peer({debug:0});this.peer=peer;
      peer.on('error',()=>{clearTimeout(to);fail()});
      peer.on('open',()=>{
        const c=peer.connect(PEER_PREFIX+this.room,{reliable:true});
        c.on('open',()=>{if(done){try{c.close()}catch(e){}return}done=true;clearTimeout(to);this.conn=c;this.status('p2p');this.flush()});
        c.on('data',m=>this.rx(m));
        c.on('close',()=>{if(this.conn===c){this.conn=null;this.startMqtt()}});
        c.on('error',()=>{});
      });
    }catch(e){clearTimeout(to);fail()}
  }
  async startMqtt(){
    if(this.mq){this.status(this.mq.connected?'mqtt':'conectando');return}
    try{await loadScript('mqtt')}catch(e){this.status('sin conexión');setTimeout(()=>this.startMqtt(),3000);return}
    const c=mqtt.connect(BROKER,{clientId:'pkbc_'+Math.random().toString(36).slice(2,10),reconnectPeriod:2000,connectTimeout:8000});this.mq=c;
    c.on('connect',()=>{c.subscribe(TOPIC(this.room)+'/down');if(!this.conn)this.status('mqtt');this.flush()});
    c.on('close',()=>{if(!this.conn)this.status('conectando')});
    c.on('message',(t,p)=>{try{this.rx(JSON.parse(p.toString()))}catch(e){}});
  }
  flush(){if(this.pending){const p=this.pending;this.pending=null;this.send(p)}}
  send(m){
    if(this.bc){this.bc.postMessage({up:1,m});return}
    if(this.conn&&this.conn.open){try{this.conn.send(m);return}catch(e){}}
    if(this.mq&&this.mq.connected){this.mq.publish(TOPIC(this.room)+'/up',JSON.stringify(m));return}
    this.pending=m;
  }
}

function setBombTime(el,ms,total){
  if(!el)return;const s=Math.max(0,ms);const r=el.querySelector('.tring');
  if(r){r.setAttribute('stroke-dashoffset',String(351.9*(1-s/total)));r.setAttribute('stroke',s<3000?'#ff3b4e':s<6000?'#ff9f1c':'#ffd23f')}
  const n=el.querySelector('.num');if(n){const t=Math.ceil(s/1000);if(n.textContent!==String(t))n.textContent=t}
  el.classList.toggle('hot',s<3000);
}
function boomFX(parent,x,y){

/* =========================================================
   HOST (autoridad del juego) + ESPECTADOR
   ========================================================= */
const HKEY='pkbomba-host-'+ROOM;
let S=null,net=null,clockOff=0,lastV=-1,lastEpoch=null,myId=null;
const T_REVEAL=3400,T_COUNT=3000,T_BOOM=5200;

function hostInit(){
  S=store.get(HKEY);
  if(!S||S.room!==ROOM)S={room:ROOM,v:0,phase:'lobby',players:[],kicked:[],holder:null,lastPasser:null,stopBy:null,cat:null,fuse:10000,deadline:0,remaining:0,phaseEnd:0,round:0,turn:0,elim:null,elimWhy:'',winner:null,used:[]};
  S.epoch=Math.random().toString(36).slice(2,8);
  if(S.phase==='playing'){S.phase='stop';S.remaining=S.fuse;S.stopBy=null}   // si se recargó en medio de la ronda, pausa
  const seen={};S.players.forEach(p=>{p.on=false;seen[p.id]=0});
  const H={seen};
  net=new HostNet(ROOM,m=>hostMsg(m,H),st=>renderNet(st));
  net.start();
  setInterval(()=>hostTick(H),80);
  setInterval(()=>push(false),1500);
  stageInit(true);
  push();
}
function push(bump=true){if(bump)S.v++;S.now=Date.now();store.set(HKEY,S);net.send({t:'state',s:S});onState(S,true)}
function alive(){return S.players.filter(p=>p.alive)}
function nextAlive(id){const a=S.players;const i=a.findIndex(p=>p.id===id);for(let k=1;k<=a.length;k++){const p=a[(i+k)%a.length];if(p.alive)return p.id}return id}
function hostMsg(m,H){
  if(!m||typeof m!=='object')return;
  const now=Date.now();
  if(m.t==='join'){
    if(m.role==='viewer')return;
    const id=String(m.id||'').slice(0,40);if(!id)return;H.seen[id]=now;
    let p=S.players.find(x=>x.id===id);
    if(p){let ch=!p.on;p.on=true;if(S.phase==='lobby'){const nm=String(m.name||'').slice(0,16)||p.name,av=+m.av||p.av;if(nm!==p.name||av!==p.av){p.name=nm;p.av=av;ch=true}}if(ch)push();return}
    if(S.kicked.includes(id)||S.phase!=='lobby'||S.players.length>=6)return;
    S.players.push({id,name:String(m.name||'Jugador').slice(0,16),av:+m.av||25,alive:true,on:true});push();return;
  }
  if(m.t==='pass'){if(S.phase==='playing'&&S.holder===m.id&&m.turn===S.turn)doPass();return}
  if(m.t==='stop'){if(S.phase==='playing'&&m.turn===S.turn&&S.players.some(p=>p.id===m.id))doStop(m.id);return}
}
function doPass(){S.lastPasser=S.holder;S.holder=nextAlive(S.holder);S.turn++;S.passes=(S.passes||0)+1;S.deadline=Date.now()+S.fuse;push()}
function doStop(by){S.phase='stop';S.remaining=Math.max(500,S.deadline-Date.now());S.stopBy=by;push()}
function hostTick(H){
  const now=Date.now();let ch=false;
  for(const p of S.players){const on=now-(H.seen[p.id]||0)<7000;if(p.on!==on){p.on=on;ch=true}}
  if(S.phase==='lobby'){const before=S.players.length;S.players=S.players.filter(p=>p.on||now-(H.seen[p.id]||0)<30000||H.seen[p.id]===0&&false);if(S.players.length!==before)ch=true}
  if(S.phase==='reveal'&&now>=S.phaseEnd){S.phase='countdown';S.phaseEnd=now+T_COUNT;ch=true}
  else if(S.phase==='countdown'&&now>=S.phaseEnd){S.phase='playing';S.deadline=now+S.fuse;S.turn++;ch=true}
  else if(S.phase==='playing'&&now>=S.deadline){eliminate(S.holder,'boom');return}
  else if(S.phase==='boom'&&now>=S.phaseEnd){if(alive().length<=1){S.phase='winner';S.winner=(alive()[0]||{}).id;ch=true}else{startRound();return}}
  if(ch)push();
}
function eliminate(id,why){const p=S.players.find(x=>x.id===id);if(p)p.alive=false;S.elim=id;S.elimWhy=why;S.phase='boom';S.phaseEnd=Date.now()+T_BOOM;S.stopBy=why==='boom'?null:S.stopBy;push()}
function startRound(keepHolder){
  S.round++;const c=genCategory(S.used);S.used.push(c.key);S.cat=c;
  const a=alive();if(!keepHolder||!a.some(p=>p.id===S.holder))S.holder=pick(a).id;
  S.lastPasser=null;S.stopBy=null;S.elim=null;S.passes=0;S.phase='reveal';S.phaseEnd=Date.now()+T_REVEAL;push();
}
const hostAct={
  start(){if(S.players.length<2)return;S.players.forEach(p=>p.alive=true);S.round=0;S.used=[];S.winner=null;startRound()},
  lobby(){S.phase='lobby';S.players.forEach(p=>p.alive=true);S.round=0;S.cat=null;S.winner=null;S.elim=null;push()},
  fuse(ms){S.fuse=ms;push()},
  kick(id){S.players=S.players.filter(p=>p.id!==id);S.kicked.push(id);push()},
  resolve(k){
    if(S.phase!=='stop')return;
    if(k==='go'){S.phase='playing';S.deadline=Date.now()+S.remaining;S.turn++;S.stopBy=null;push();return}
    const id=k==='last'?S.lastPasser:k==='holder'?S.holder:S.stopBy;
    if(id)eliminate(id,k==='stopper'?'falso':'stop');
  },
  hostStop(){if(S.phase==='playing')doStop('__host')},
  reroll(){if(['reveal','countdown','playing','stop'].includes(S.phase)){S.round--;startRound(true)}},
};

function ringPos(i,n){const a=-Math.PI/2+i*2*Math.PI/n;return [50+38*Math.cos(a),50+38*Math.sin(a),a]}
let ringSig='';
function layoutRing(force){
  const ring=$('#ring');if(!ring||!S)return;
  const n=S.players.length;const sig=S.players.map(p=>p.id+p.av+p.name).join()+n;
  if(sig!==ringSig||force){ringSig=sig;ring.querySelectorAll('.pl').forEach(e=>e.remove());
    S.players.forEach((p,i)=>{const [x,y]=ringPos(i,n);const d=document.createElement('div');d.className='pl';d.dataset.id=p.id;d.style.left=x+'%';d.style.top=y+'%';
      d.innerHTML=`<div class="ava"><img src="${SPR(p.av)}" alt=""></div><div class="nm">${esc(p.name)}</div><div class="off-tag hidden">desconectado</div>`;ring.appendChild(d)})}
  const nx=S.holder&&['playing','stop','countdown','reveal'].includes(S.phase)?nextAliveC(S.holder):null;
  S.players.forEach(p=>{const d=ring.querySelector(`.pl[data-id="${CSS.escape(p.id)}"]`);if(!d)return;
    d.classList.toggle('dead',!p.alive);d.classList.toggle('off',!p.on);d.querySelector('.off-tag').classList.toggle('hidden',p.on);
    d.classList.toggle('hold',p.id===S.holder&&['playing','countdown','reveal','stop'].includes(S.phase)&&p.alive);d.classList.toggle('next',p.id===nx&&S.phase==='playing')});
  const bomb=$('#bomb');const hi=S.players.findIndex(p=>p.id===S.holder);
  const showB=hi>=0&&['reveal','countdown','playing','stop'].includes(S.phase);bomb.classList.toggle('hidden',!showB);
  if(showB){const [,,a]=ringPos(hi,n);bomb.style.left=(50+14*Math.cos(a))+"%";bomb.style.top=(50+14*Math.sin(a))+"%"}
}
function nextAliveC(id){const a=S.players;const i=a.findIndex(p=>p.id===id);for(let k=1;k<=a.length;k++){const p=a[(i+k)%a.length];if(p.alive)return p.id}return null}
const pname=id=>id==='__host'?'El anfitrión':esc((S.players.find(p=>p.id===id)||{name:'?'}).name);
const pav=id=>(S.players.find(p=>p.id===id)||{av:25}).av;
let spinTimer=null,ovKey='',lastTickSec=-1;
function renderCat(){
  const box=$('#catbox');if(!box)return;
  if(S.phase==='lobby'){box.classList.remove('spin');$('#catK').textContent=`Jugadores ${S.players.length}/6`;$('#catT').innerHTML=`Uníte con el código <span class="hl">${ROOM}</span>`;$('#catC').innerHTML='';$('#catN').textContent='';$('#roundB').textContent='LOBBY';return}
  $('#roundB').textContent='RONDA '+S.round;
  if(S.phase==='reveal'&&S.now&&Date.now()<S.phaseEnd+clockOff-900){
    if(!spinTimer){box.classList.add('spin');$('#catK').textContent='Sorteando categoría…';spinTimer=setInterval(()=>{const h=catHTML(genCategory());$('#catT').innerHTML=h.title;$('#catC').innerHTML=h.chips;$('#catN').textContent='';if(ROLE==='host')beep(1200+rnd(400),.02,'square',.03)},90)}
    return;
  }
  if(spinTimer){clearInterval(spinTimer);spinTimer=null;box.classList.remove('spin');box.classList.remove('land');void box.offsetWidth;box.classList.add('land');beep(660,.12,'triangle',.12)}
  const h=catHTML(S.cat);$('#catK').textContent='Categoría';$('#catT').innerHTML=h.title;$('#catC').innerHTML=h.chips;$('#catN').textContent=S.cat?`${S.cat.n} respuestas posibles`:'';
}
function renderOverlay(){
  const ov=$('#ov');if(!ov)return;let key=S.phase,h='';
  if(S.phase==='countdown'){const left=Math.ceil((S.phaseEnd+clockOff-Date.now())/1000);key+=left;if(left>0)h=`<div class="big cd" style="color:var(--yel)">${left}</div><div class="sub">La bomba empieza en <span style="color:var(--red)">${pname(S.holder)}</span></div>`}
  else if(S.phase==='stop'){key+=S.stopBy+S.lastPasser;h=`<div class="big stop-title">¡STOP!</div><div class="sub">${pname(S.stopBy||'__host')} ${S.lastPasser?`desconfía de <span style="color:var(--yel)">${pname(S.lastPasser)}</span>`:'frenó el juego'}</div><div class="mut">Juego en pausa · el anfitrión decide</div>`}
  else if(S.phase==='boom'){key+=S.elim;h=`<div class="winner-av" style="border-color:var(--red);box-shadow:0 0 80px #ff3b4e88;filter:grayscale(.6)"><img src="${SPR(pav(S.elim))}"></div><div class="big boom-title">${S.elimWhy==='boom'?'¡BOOM!':'¡AFUERA!'}</div><div class="sub">${pname(S.elim)} queda eliminado${S.elimWhy==='stop'?' (respuesta inválida)':S.elimWhy==='falso'?' (STOP falso)':''}</div><div class="mut">Quedan ${alive().length}</div>`}
  else if(S.phase==='winner'){key+=S.winner;h=`<div class="winner-av"><img src="${SPR(pav(S.winner))}"></div><div class="big logo">¡${pname(S.winner)}<br>GANA!</div><div class="sub">👑 Última persona en pie</div>`}
  if(key===ovKey)return;const prev=ovKey;ovKey=key;
  ov.classList.toggle('hidden',!h);ov.classList.toggle('dim',!!h&&S.phase!=='countdown');ov.innerHTML=h;
  if(S.phase==='countdown'&&h)beep(440,.12,'triangle',.12);
  if(S.phase==='stop'&&!prev.startsWith('stop'))stopSound();
  if(S.phase==='boom'&&!prev.startsWith('boom')){boomSound();const i=S.players.findIndex(p=>p.id===S.elim);if(i>=0){const [x,y]=ringPos(i,S.players.length);boomFX($('#ring'),x+'%',y+'%')}}
  if(S.phase==='winner'&&!prev.startsWith('winner')){winSound();confetti()}
}
function stageLoop(){
  if(S){
    if(S.phase==='playing'){const ms=S.deadline+clockOff-Date.now();setBombTime($('#bomb'),ms,S.fuse);const sec=Math.ceil(ms/1000);if(sec!==lastTickSec&&sec>0){lastTickSec=sec;beep(sec<=3?1100:760,.05,'square',sec<=3?.09:.05)}}
    else if(S.phase==='stop')setBombTime($('#bomb'),S.remaining,S.fuse);
    else setBombTime($('#bomb'),S.fuse,S.fuse);
    if(S.phase==='countdown'||S.phase==='reveal'){renderOverlay();renderCat()}
  }
  requestAnimationFrame(stageLoop);
}
function onState(s,local){
  if(!local){ if(s.epoch!==lastEpoch){lastEpoch=s.epoch;lastV=-1} if(s.v<lastV)return; lastV=s.v; clockOff=Date.now()-s.now }
  const old=S;S=s;
  if(ROLE==='player'){renderPlayer(old);return}
  if(old&&old.holder!==S.holder&&S.phase==='playing'&&old.phase==='playing')passSound();
  layoutRing();renderCat();renderOverlay();if(ROLE==='host')renderCtrl();
}

function startPlayer(){
  $('#app').innerHTML=`<div id="player"><div class="card center" style="padding:30px;margin-top:30vh">Conectando a la sala ${ROOM}…</div></div>`;
  cnet=new ClientNet(ROOM,m=>{if(m.t==='state')onState(m.s)},s=>{connMode=s;const b=$('#connb');if(b)b.classList.toggle('hidden',s==='p2p'||s==='mqtt'||s==='local')});
  cnet.start();
  const hb=()=>cnet.send({t:'join',id:me.id,name:me.name,av:me.av});hb();setInterval(hb,2500);
  document.addEventListener('pointerdown',()=>audio(),{once:true});
  requestAnimationFrame(playerLoop);
}
let pSig='',pTick=-1,pBoomShown=null;
function renderPlayer(old){
  const mine=S.players.find(p=>p.id===me.id);
  const holding=mine&&S.holder===me.id&&['playing','stop','countdown','reveal'].includes(S.phase);
  if(old&&S.phase==='playing'&&S.holder===me.id&&(old.holder!==me.id||old.phase!=='playing')){try{navigator.vibrate&&navigator.vibrate([120,60,120])}catch(e){}passSound()}
  if(old&&old.holder===me.id&&S.holder!==me.id)passSound();
  const sig=JSON.stringify([S.phase,S.players,S.holder,S.cat&&S.cat.key,S.stopBy,S.lastPasser,S.elim,S.winner,connMode,S.turn]);
  if(sig===pSig)return;pSig=sig;
  const h=catHTML(S.cat);
  const nx=S.holder?nextAliveC(S.holder):null;
  let main='';
  if(!mine){main=`<div class="pmsg">${S.phase==='lobby'?(S.kicked&&S.kicked.includes(me.id)?'Te sacaron de la sala 😕':S.players.length>=6?'La sala está llena (6/6)':'Entrando…'):'La partida ya empezó. Vas a poder entrar en la próxima.'}</div>`}
  else if(S.phase==='lobby'){main=`<div class="pmsg">¡Estás adentro! 🎉</div><div class="mut">Esperando que el anfitrión empiece… (${S.players.length}/6)</div>`}
  else if(S.phase==='reveal'){main=`<div class="pmsg">🎲 Sorteando categoría…</div>`}
  else if(S.phase==='countdown'){main=holding?`<div class="pmsg" style="color:var(--red)">¡Empezás vos con la bomba!</div>`:`<div class="pmsg">Empieza ${pname(S.holder)}</div>`}
  else if(S.phase==='playing'||S.phase==='stop'){
    if(!mine.alive)main=`<div class="pmsg">💀 Quedaste afuera</div><div class="mut">Seguí mirando. Todavía podés tocar STOP.</div>`;
    if(holding){main=`<div class="p-bomb bomb" id="pbomb" style="position:relative;transform:none;left:auto;top:auto;width:min(58vw,240px)">${bombSVG()}</div>
      <button class="passbtn" id="pass" ${S.phase!=='playing'?'disabled':''}>💣 ¡PASAR!</button><div class="mut">Decí un Pokémon en voz alta y pasala a <b>${pname(nx)}</b></div>`}
    else if(mine.alive){main=`<div class="holder-mini"><img src="${SPR(pav(S.holder))}"><div style="text-align:left"><div class="mut" style="font-size:14px">La bomba la tiene</div>${pname(S.holder)}</div></div><div class="bar"><i id="pbar"></i></div>${nx===me.id?'<div class="pmsg" style="color:var(--yel)">⚠️ ¡Después venís vos! Pensá tu respuesta</div>':''}`}
    if(S.phase==='stop')main=`<div class="big stop-title" style="font-size:64px">¡STOP!</div><div class="pmsg">${pname(S.stopBy||'__host')} ${S.lastPasser?`desconfía de ${pname(S.lastPasser)}`:'frenó el juego'}</div><div class="mut">El anfitrión está decidiendo…</div>`;
  }
  else if(S.phase==='boom'){main=`<div class="big boom-title" style="font-size:70px">${S.elimWhy==='boom'?'¡BOOM!':'¡AFUERA!'}</div><div class="pmsg">${S.elim===me.id?'Quedaste eliminado 💥':pname(S.elim)+' quedó afuera'}</div>`}
  else if(S.phase==='winner'){main=`<div class="winner-av" style="width:180px"><img src="${SPR(pav(S.winner))}"></div><div class="big logo" style="font-size:44px">${S.winner===me.id?'¡GANASTE!':pname(S.winner)+'<br>GANA'}</div>`}
  const canStop=mine&&S.phase==='playing';
  $('#app').innerHTML=`<div id="player">
    <div class="connbar ${connMode==='p2p'||connMode==='mqtt'||connMode==='local'?'hidden':''}" id="connb">Reconectando…</div>
    <div class="p-top"><img src="${SPR(me.av)}"><div class="who"><b>${esc(me.name)}</b><small>Sala ${ROOM}${S.round?' · Ronda '+S.round:''}</small></div><button class="stopbtn" id="stopb" ${canStop?'':'disabled'}>✋ STOP</button></div>
    ${S.cat&&S.phase!=='lobby'&&S.phase!=='reveal'?`<div class="card p-cat"><div class="cat-kicker">Categoría</div><div class="cat-title">${h.title}</div><div class="chips">${h.chips}</div></div>`:''}
    <div class="p-main">${main}</div>
    <div class="strip">${S.players.map(p=>`<div class="${p.id===S.holder&&['playing','stop'].includes(S.phase)?'h':''} ${p.alive?'':'d'} ${p.id===me.id?'me':''}"><img src="${SPR(p.av)}"><span>${esc(p.name)}</span></div>`).join('')}</div>
  </div>`;
  document.body.classList.toggle('danger',!!holding&&S.phase==='playing');
  const pb=$('#pass');if(pb)pb.onclick=()=>{if(sentTurn===S.turn)return;sentTurn=S.turn;pb.disabled=true;pb.textContent='¡PASADA!';cnet.send({t:'pass',id:me.id,turn:S.turn});passSound()};
  const sb=$('#stopb');if(sb)sb.onclick=()=>{if(S.phase!=='playing')return;cnet.send({t:'stop',id:me.id,turn:S.turn});sb.disabled=true;stopSound()};
  if(S.phase==='boom'&&pBoomShown!==S.round+S.elim){pBoomShown=S.round+S.elim;if(S.elim===me.id){boomSound();boomFX(document.body,'50%','45%');try{navigator.vibrate&&navigator.vibrate(600)}catch(e){}}else beep(200,.3,'sine',.2)}
  if(S.phase==='winner'&&old&&old.phase!=='winner'){winSound();confetti()}
}
function playerLoop(){
  if(S&&S.phase==='playing'){
    const ms=S.deadline+clockOff-Date.now();
    const pbomb=$('#pbomb');if(pbomb)setBombTime(pbomb,ms,S.fuse);
    const bar=$('#pbar');if(bar)bar.style.width=Math.max(0,100*ms/S.fuse)+'%';
    if(S.holder===me.id){const sec=Math.ceil(ms/1000);if(sec!==pTick&&sec>0){pTick=sec;beep(sec<=3?1100:760,.05,'square',sec<=3?.1:.05)}}
  }else if(S&&S.phase==='stop'){const pbomb=$('#pbomb');if(pbomb)setBombTime(pbomb,S.remaining,S.fuse)}
  requestAnimationFrame(playerLoop);
}

/* ---------------- Arranque ---------------- */
if(ROLE==='home')renderHome();
else if(ROLE==='host')hostInit();
else if(ROLE==='ver')viewerInit();
else playerInit();
</script>
</body>
</html>
